<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body class="bg-light pb-5">

    <div class="bg-white p-3 border-bottom d-flex align-items-center">
        <a href="index.html" class="text-dark me-3"><i class="bi bi-arrow-left fs-4"></i></a>
        <h5 class="mb-0 fw-bold">Carrinho de Compras</h5>
    </div>

    <div class="container my-3">
        <!-- Itens do Carrinho -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">
            <div class="card-body" id="lista-carrinho">
                <p class="text-center text-muted">Seu carrinho está vazio.</p>
            </div>
        </div>

        <!-- Modalidade de Entrega -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">
            <div class="card-body">
                <h6 class="fw-bold mb-3"><i class="bi bi-truck me-2"></i>Tipo de Entrega</h6>
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="tipo_entrega" id="entrega-delivery" value="1" checked
                        onchange="alternarEntrega()">
                    <label class="btn btn-outline-danger" for="entrega-delivery">Delivery</label>

                    <input type="radio" class="btn-check" name="tipo_entrega" id="entrega-retirada" value="2"
                        onchange="alternarEntrega()">
                    <label class="btn btn-outline-danger" for="entrega-retirada">Retirada no Local</label>
                </div>
            </div>
        </div>

        <!-- Dados do Cliente e Endereço -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">
            <div class="card-body">
                <h6 class="fw-bold mb-3"><i class="bi bi-person me-2"></i>Seus Dados</h6>
                <div class="mb-2">
                    <input type="text" id="cliente_nome" class="form-control" placeholder="Seu Nome Completo *">
                </div>
                <div class="mb-2">
                    <input type="tel" id="cliente_telefone" class="form-control" placeholder="Seu WhatsApp/Telefone *">
                </div>

                <div id="secao-endereco">
                    <h6 class="fw-bold my-3"><i class="bi bi-geo-alt me-2"></i>Endereço de Entrega</h6>
                    <div class="row g-2 mb-2">
                        <div class="col-8">
                            <input type="text" id="end_rua" class="form-control" placeholder="Rua / Avenida *">
                        </div>
                        <div class="col-4">
                            <input type="text" id="end_numero" class="form-control" placeholder="Número *">
                        </div>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <input type="text" id="end_bairro" class="form-control" placeholder="Bairro *">
                        </div>
                        <div class="col-6">
                            <input type="text" id="end_complemento" class="form-control"
                                placeholder="Comp. (Apt/Bloco)">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Forma de Pagamento -->
        <div class="card border-0 shadow-sm rounded-4 mb-3">
            <div class="card-body">
                <h6 class="fw-bold mb-3"><i class="bi bi-credit-card me-2"></i>Forma de Pagamento</h6>
                <select id="forma_pagamento" class="form-select mb-2" onchange="verificarTroco()">
                    <option value="1">PIX</option>
                    <option value="2">Cartão de Crédito</option>
                    <option value="3">Cartão de Débito</option>
                    <option value="4">Dinheiro</option>
                </select>
                <div id="campo-troco" class="d-none mt-2">
                    <input type="number" id="troco_para" class="form-control"
                        placeholder="Troco para quanto? (Ex: 50.00)">
                </div>
            </div>
        </div>

        <!-- Resumo de Valores -->
        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Subtotal</span>
                    <span id="resumo-subtotal">R$ 0,00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Taxa de Entrega</span>
                    <span id="resumo-taxa">R$ 5,00</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between fw-bold fs-5">
                    <span>Total</span>
                    <span class="text-danger" id="resumo-total">R$ 0,00</span>
                </div>
            </div>
        </div>

        <button class="btn btn-danger btn-lg w-100 rounded-pill mb-5" onclick="enviarPedido()">
            Finalizar Pedido <i class="bi bi-check-circle ms-2"></i>
        </button>
    </div>

    <script src="js/app.js"></script>
    <script src="js/carrinho.js"></script>
</body>

</html>
