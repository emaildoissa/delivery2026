<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body class="bg-light">

    <!-- Header Fixo com Botão Voltar -->
    <div class="bg-white p-3 border-bottom d-flex align-items-center">
        <a href="index.html" class="text-dark me-3"><i class="bi bi-arrow-left fs-4"></i></a>
        <h5 class="mb-0 fw-bold">Detalhes do Item</h5>
    </div>

    <div class="container my-3" id="container-produto">
        <p class="text-center text-muted my-5">Carregando detalhes...</p>
    </div>

    <!-- Barra Inferior Fixa para Adicionar ao Carrinho -->
    <div class="fixed-bottom bg-white p-3 border-top shadow-lg">
        <div class="container d-flex align-items-center justify-content-between">
            <!-- Seletor de Quantidade -->
            <div class="d-flex align-items-center border rounded-pill p-1">
                <button class="btn btn-sm btn-light rounded-circle fw-bold" onclick="alterarQtd(-1)">-</button>
                <span class="mx-3 fw-bold" id="qtd-item">1</span>
                <button class="btn btn-sm btn-light rounded-circle fw-bold" onclick="alterarQtd(1)">+</button>
            </div>

            <!-- Botão Adicionar -->
            <button class="btn btn-danger btn-lg rounded-pill px-4" onclick="adicionarAoCarrinho()">
                Adicionar • <span id="btn-total-valor">R$ 0,00</span>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/item.js"></script>
</body>

</html>
