<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .nav-pills .nav-link.active {
            background-color: #dc3545;
        }

        .card-pedido-admin {
            border-left: 5px solid #dc3545;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 mb-4">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-shop me-2"></i>Painel Delivery</a>
        <div class="ms-auto">
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair <i
                    class="bi bi-box-arrow-right"></i></button>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <h4 class="fw-bold mb-3">Gerenciador de Pedidos</h4>

        <!-- Abas de Status -->
        <ul class="nav nav-pills mb-4" id="pills-tab">
            <li class="nav-item">
                <button class="nav-link active" onclick="filtrarStatus(1, event)">Pendentes</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="filtrarStatus(2, event)">Aceitos</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="filtrarStatus(3, event)">Em Preparo</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="filtrarStatus(4, event)">Em Entrega</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" onclick="filtrarStatus(5, event)">Concluídos</button>
            </li>
        </ul>

        <!-- Lista de Pedidos -->
        <div class="row" id="container-pedidos-admin">
            <p class="text-muted">Carregando pedidos...</p>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="js/pedidos.js"></script>
</body>

</html>
