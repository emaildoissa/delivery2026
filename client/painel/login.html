<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card-login {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="card card-login shadow-lg p-4">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-danger fs-1"></i>
            <h4 class="fw-bold mt-2">Painel de Gestão</h4>
            <p class="text-muted small">Acesse com e-mail e senha cadastrados</p>
        </div>

        <div id="alerta-erro" class="alert alert-danger d-none" role="alert"></div>

        <div class="mb-3">
            <label class="form-label fw-bold">E-mail</label>
            <input type="email" id="login-email" class="form-control form-control-lg" placeholder="admin@pizzaria.com">
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Senha</label>
            <input type="password" id="login-senha" class="form-control form-control-lg" placeholder="••••••••">
        </div>

        <button class="btn btn-danger btn-lg w-100 rounded-pill" onclick="efetuarLogin()">
            Entrar no Painel <i class="bi bi-box-arrow-in-right ms-2"></i>
        </button>
    </div>

    <script src="../js/app.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
