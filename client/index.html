<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="header-banner mb-3">
        <div class="container">
            <h2 class="fw-bold mb-0">Pizzaria & Delivery</h2>
            <small><i class="bi bi-clock"></i> Aberto Agora • Entrega 30-45 min</small>
        </div>
    </header>

    <div class="container">
        <!-- Barra Deslizante de Categorias -->
        <div class="categoria-scroll mb-3" id="lista-categorias">
            <span class="text-muted">Carregando categorias...</span>
        </div>

        <!-- Listagem de Produtos -->
        <div id="conteudo-cardapio">
            <p class="text-center text-muted mt-4">Carregando produtos...</p>
        </div>
    </div>

    <!-- Menu Inferior Fixo (Navegação Mobile) -->
    <nav class="bottom-nav">
        <div class="container d-flex justify-content-around text-center">
            <a href="index.html" class="text-danger text-decoration-none">
                <i class="bi bi-journal-text fs-4 d-block"></i>
                <small>Cardápio</small>
            </a>
            <a href="carrinho.html" class="text-dark text-decoration-none position-relative">
                <i class="bi bi-cart3 fs-4 d-block"></i>
                <small>Carrinho</small>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                    id="badge-carrinho">0</span>
            </a>
            <a href="pedido.html" class="text-dark text-decoration-none">
                <i class="bi bi-receipt fs-4 d-block"></i>
                <small>Meus Pedidos</small>
            </a>
        </div>
    </nav>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
